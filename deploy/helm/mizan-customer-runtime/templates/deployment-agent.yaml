{{- if .Values.siteAgent.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-site-agent
  labels:
    app.kubernetes.io/name: mizan-customer-runtime
    app.kubernetes.io/component: site-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mizan-customer-runtime
      app.kubernetes.io/component: site-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mizan-customer-runtime
        app.kubernetes.io/component: site-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default "mizan-customer-runtime-sa" }}
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      containers:
        - name: site-agent
          image: "{{ .Values.siteAgent.image.repository }}:{{ .Values.siteAgent.image.tag }}"
          imagePullPolicy: {{ .Values.siteAgent.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                {{- toYaml .Values.securityContext.capabilities.drop | nindent 16 }}
          # Strictly NO containerPort directives; agent initiates all connections outbound
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
          resources:
            {{- toYaml .Values.siteAgent.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: model-storage
              mountPath: /var/lib/mizan/models
            - name: runtime-data
              mountPath: /var/lib/mizan/data
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: model-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-model-storage
        - name: runtime-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-runtime-data
        {{- else }}
        - name: model-storage
          emptyDir: {}
        - name: runtime-data
          emptyDir: {}
        {{- end }}
{{- end }}
