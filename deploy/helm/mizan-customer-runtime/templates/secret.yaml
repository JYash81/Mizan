apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/name: mizan-customer-runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  AGENT_KEY_ID: {{ .Values.secrets.agentKeyId | default "agent-key-01" | quote }}
  ENROLLMENT_TOKEN: {{ .Values.secrets.enrollmentToken | default "" | quote }}
