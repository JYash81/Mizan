{{- if and .Values.monitoring .Values.monitoring.serviceMonitor .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-servicemonitor
  labels:
    app.kubernetes.io/name: mizan-customer-runtime
    app.kubernetes.io/component: runtime
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mizan-customer-runtime
      app.kubernetes.io/component: runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /api/v1/ops/metrics/prometheus
      interval: {{ .Values.monitoring.serviceMonitor.interval | default "15s" }}
{{- end }}
