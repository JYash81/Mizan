services:
  - type: web
    name: mizan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    plan: free
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://mizan.hennt.in,https://llmguru.hennt.in,https://hennt.in,http://localhost:5173,http://localhost:3000
      - key: FRONTEND_URL
        value: https://mizan.hennt.in
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: SMTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: llmguru@hennt.in
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: llmguru@hennt.in
      - key: SMTP_USE_SSL
        value: "true"
      - key: MAIL_RELAY_URL
        value: https://mizan.hennt.in/mail-relay.php
      - key: MAIL_RELAY_SECRET
        sync: false
      - key: BACKUP_PASSPHRASE
        sync: false
      - key: PLATFORM_OPERATOR_EMAILS
        value: yeswanthjanne86@gmail.com,llmguru@hennt.in
      - key: PROMETHEUS_SCRAPE_TOKEN
        sync: false
